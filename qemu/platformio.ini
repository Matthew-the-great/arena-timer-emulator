[platformio]
default_envs = esp32da
src_dir = ../../ArenaTimer/Software/main/src
include_dir = ../../ArenaTimer/Software/main/include

[env:esp32da]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = arduino
platform_packages = toolchain-xtensa-esp-elf@symlink://../.tools/xtensa-official/xtensa-esp-elf
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
build_flags = -D ENABLE_DEBUG_LOG
lib_deps =
    fastled/FastLED @ 3.9.15
    links2004/WebSockets @ 2.6.1
    ayushsharma82/ElegantOTA @ 3.1.7
extra_scripts = post:merge_firmware.py
